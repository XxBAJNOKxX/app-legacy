name: Build APK

# Builds a release APK on every push and pull request so that changes are
# compile-checked and an installable artifact is produced without needing the
# project's release keystore.
#
# Signing uses a throwaway key generated during the run, which is why this also
# works on forks and pull requests where secrets are unavailable. For signed
# release builds see builder.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the version CONTRIBUTING.md documents for this project.
  FLUTTER_VERSION: "3.27.1"
  JAVA_VERSION: "17"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4.2.2

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: "true"

      # app/build.gradle always signs the release build type with the keystore
      # described by refilc/android/key.properties, so a build cannot proceed
      # without one. Generate a throwaway keystore instead of requiring the
      # release secrets.
      #
      # storeFile is written as an absolute path on purpose: build.gradle
      # resolves it with file(...) from the app module directory, so a bare
      # filename would be looked up under refilc/android/app/.
      - name: Create an ephemeral signing key
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/refilc/android/ci-ephemeral.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias firka-ci \
            -storepass firka-ci \
            -keypass firka-ci \
            -dname "CN=Firka CI, OU=CI, O=Firka, L=Budapest, C=HU"

          echo "storeFile=$KEYSTORE" > refilc/android/key.properties
          echo "storePassword=firka-ci" >> refilc/android/key.properties
          echo "keyPassword=firka-ci" >> refilc/android/key.properties
          echo "keyAlias=firka-ci" >> refilc/android/key.properties

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: |
          chmod +x fix-pub.sh
          ./fix-pub.sh

      - name: Build APK
        run: |
          cd refilc
          chmod +x build.sh
          ./build.sh

      - name: List build output
        run: |
          echo "APKs produced:"
          ls -lh refilc/build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4.6.1
        with:
          name: firka-apk-${{ github.run_number }}
          path: refilc/build/app/outputs/flutter-apk/*-release.apk
          # Fail loudly rather than uploading an empty artifact if the glob
          # matches nothing.
          if-no-files-found: error
          retention-days: 14
